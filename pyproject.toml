[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leetcode-tracker"
version = "1.0.0"
description = "CLI-приложение для отслеживания прогресса решения задач LeetCode с системой повторений"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nicklas Plugin", email = "nikolya.plugin@gmail.com" }]
keywords = ["leetcode", "cli", "spaced-repetition", "competitive-programming"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Education",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.7",
    "SQLAlchemy>=2.0",
    "cryptography>=42.0",
    "python-dateutil>=2.9",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "freezegun>=1.4",
    "mypy>=1.9",
    "ruff>=0.4",
]

[project.scripts]
lct = "cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=leetcode_tracker --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/leetcode_tracker"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"